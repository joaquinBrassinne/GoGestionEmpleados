{{define "start-tmpl.html"}}
{{template "header-tmpl.html" .}}

    <a name="" id="" class="btn btn-primary" href="/create" role="button">Add Employee</a>    
<br>
<br>

        <table class="table">
          <thead>
              <tr>
                  <th>ID</th>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Actions</th>
              </tr>
          </thead>
          <tbody>

            {{range . }}
              <tr>
                  <td>{{.Id}}</td>
                  <td>{{.Name}}</td>
                  <td>{{.Email}}</td>
                  <td><a name="" id="" class="btn btn-warning" href="/edit?id={{.Id}}" role="button">Edit</a> 
                    |
                    <a name="" id="" class="btn btn-danger" href="/delete?id={{.Id}}" role="button">Delete</a>
              </tr>
            {{end}}
          </tbody>
        </table>

{{template "footer-tmpl.html" .}}
{{end}}
